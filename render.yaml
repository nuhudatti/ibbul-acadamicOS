services:
  - type: web
    name: ibbul-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      # Set remaining secrets in the Render dashboard:
      # SECRET_KEY, DATABASE_URL, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS,
      # CORS_ALLOWED_ORIGINS, CLOUDINARY_*, FRONTEND_BASE_URL, EMAIL_*
